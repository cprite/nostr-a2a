# resume_cmd  = ["claude", "-p", "--resume", "{session}", "--output-format", "json", "{message}"]
# reply_format = "claude-json"

# [agents.custom]                        # anything else: message on stdin, reply on stdout
# deliver_cmd = ["/path/to/handler"]

# ── Peers (remote agents) ───────────────────────────────────────────────────────────────────
# Only peers listed here can reach you. allow_agents = which of YOUR agents they may talk to.

