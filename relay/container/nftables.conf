#!/usr/sbin/nft -f
# nostr-relay CT106: never open connections INTO the tailnet, accept nothing new from it.
# Funnel traffic is proxied by tailscaled to 127.0.0.1 (arrives on lo, not tailscale0).
table inet ct106 {}
delete table inet ct106
table inet ct106 {
  chain output {
    type filter hook output priority 0; policy accept;
    oifname "tailscale0" ct state new counter drop comment "no outbound to tailnet"
  }
  chain input {
    type filter hook input priority 0; policy accept;
    iifname "tailscale0" ct state established,related accept
    iifname "tailscale0" counter drop comment "no inbound from tailnet"
  }
}
